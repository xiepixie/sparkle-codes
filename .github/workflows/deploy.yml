name: 🚀 Sparkle Production Pipeline

# Validates on PRs; builds, pushes, and deploys on pushes to main.
on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # --- 1. Validation Phase (CI) ---
  validate-web:
    name: 🌐 Validate Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: 📦 Install
        run: pnpm install --frozen-lockfile
      - name: 🧹 Lint
        run: pnpm lint
      - name: 🏗️ Build Check
        run: pnpm build

  validate-rust:
    name: 🦀 Validate Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 🏗️ Check
        run: cargo check --workspace
      - name: 🧪 Clippy
        run: cargo clippy --workspace -- -D warnings

  # --- 2. Build Phase (Only on Push to Main) ---
  build:
    name: 🏗️ Build & Push
    needs: [validate-web, validate-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and Push (Bake)
        uses: docker/bake-action@v5
        with:
          push: true
          files: |
            docker-bake.hcl
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          TAG: sha-${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}

  # --- 3. Deploy Phase (Only on Success of Build) ---
  deploy:
    name: 🚀 Remote Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 🚀 SSH Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # 1. 进入 1Panel 站点目录
            export TARGET_DIR="/opt/1panel/apps/openresty/openresty/www/sites/sparkle.codes"
            cd $TARGET_DIR
            
            # 2. 修复 Git 安全目录问题
            git config --global --add safe.directory $TARGET_DIR
            
            # 3. 更新配置 (如果该目录下有 git 仓库)
            if [ -d ".git" ]; then
              echo "🚚 Updating repository content..."
              git fetch origin main
              git reset --hard origin/main
            fi
            
            echo "🐳 Pulling latest images..."
            # 如果依然报错，我们尝试显式使用 sudo (前提是该用户在 sudoers 里且无需密码)
            if ! docker compose pull; then
              echo "⚠️ Docker permission denied, trying with sudo..."
              sudo docker compose pull
            fi
            
            echo "🔄 Swapping containers..."
            if ! docker compose up -d --remove-orphans; then
              sudo docker compose up -d --remove-orphans
            fi
            
            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f
            
            echo "✅ Deployment status:"
            sudo docker compose ps
