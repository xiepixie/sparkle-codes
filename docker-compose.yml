name: sparkle-codes
services:
  web:
    image: ghcr.io/xiepixie/sparkle-web:latest
    container_name: sparkle-next-web
    restart: unless-stopped
    mem_limit: 2g # 限制运行时内存，防止因内存泄漏拖垮 VPS
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1536
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docs:
    image: ghcr.io/xiepixie/sparkle-docs:latest
    container_name: sparkle-next-docs
    restart: unless-stopped
    mem_limit: 1536m
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env # docs 也可能需要环境变量
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=1024
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
