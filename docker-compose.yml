name: sparkle-codes
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
      args:
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_DOCS_URL=${NEXT_PUBLIC_DOCS_URL}
        - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
    container_name: sparkle-next-web
    restart: unless-stopped
    mem_limit: 2g
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_OPTIONS=--max-old-space-size=1536
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  docs:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-docs
      args:
        - NEXT_PUBLIC_DOCS_URL=${NEXT_PUBLIC_DOCS_URL}
        - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
    container_name: sparkle-next-docs
    restart: unless-stopped
    mem_limit: 1536m
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=1024
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
