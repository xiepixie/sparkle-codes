[package]
name = "markdown-parser"
version = "0.1.0"
edition = "2021"
description = "Pure Rust Markdown parser: rlib for native Sentinel daemon."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
markdown = "1.0.0-alpha.18"
regex = "1.10"
once_cell = "1.19"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
