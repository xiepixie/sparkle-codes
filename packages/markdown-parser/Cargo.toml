[package]
name = "markdown-parser"
version = "0.1.0"
edition = "2021"
description = "Pure Rust Markdown parser: rlib for native Sentinel daemon."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
markdown = "1"
regex = "1"
once_cell = "1.19"
unicode-normalization = "0.1"
fancy-regex = "0.17"
