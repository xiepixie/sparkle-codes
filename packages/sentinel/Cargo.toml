[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
description = "Native Rust daemon: watches Obsidian vault, parses Markdown, syncs to Neon."

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
regex = "1"

# File system watcher
notify = "6.1"
notify-debouncer-mini = "0.4"
walkdir = "2.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }

# Chrono & Utility
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
yaml-rust2 = "0.9"
urlencoding = "2.1"
cuid2 = "0.1"


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling & logging
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
markdown-parser = { path = "../markdown-parser" }
